<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Planche du Dernier Mot</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px 28px 64px;
    background: #16161a; color: #e8e8ea;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { position: sticky; top: 0; z-index: 2; margin: -24px -28px 24px;
    padding: 16px 28px; background: #16161aee; backdrop-filter: blur(8px);
    border-bottom: 1px solid #2c2c33; }
  h1 { margin: 0; font-size: 18px; font-weight: 650; }
  header p { margin: 4px 0 0; color: #9a9aa4; font-size: 13px; }
  .grille { display: grid; gap: 26px 20px;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .vue { margin: 0; }
  .vue img { display: block; width: 100%; height: auto; border-radius: 12px;
    border: 1px solid #2c2c33; background: #fff; }
  figcaption { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px;
    margin-top: 10px; align-items: baseline; }
  .numero { grid-row: span 2; font-size: 22px; font-weight: 700; color: #6f6f7b;
    font-variant-numeric: tabular-nums; }
  .ecran { font-weight: 650; }
  .montre { grid-column: 2; color: #9a9aa4; font-size: 13px; }
</style>
</head>

  <h1>Le Dernier Mot, planche des écrans</h1>
